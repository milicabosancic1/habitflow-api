# Profil za brzo pokretanje bez PostgreSQL-a 
# Pokreni sa: --spring.profiles.active=dev-h2
spring:
  datasource:
    url: jdbc:h2:mem:habitflow;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: false

app:
  security:
    rate-limit:
      # H2 profil je za brzi lokalni razvoj/testiranje — visok limit da ne smeta
      # ponovljenim pozivima iz requests.http ili test paketa.
      capacity: 1000
      refill-seconds: 60
