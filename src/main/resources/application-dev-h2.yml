# Profil za brzo pokretanje bez PostgreSQL-a (npr. prvi test da sve radi).
# Pokreni sa: --spring.profiles.active=dev-h2
spring:
  datasource:
    url: jdbc:h2:mem:habitflow;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: false
