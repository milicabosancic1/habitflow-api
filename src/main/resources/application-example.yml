# Primer produkcione konfiguracije. Kopiraj u application-prod.yml i popuni,
# ili (bolje) koristi environment varijable.
spring:
  datasource:
    url: jdbc:postgresql://HOST:5432/habitflow
    username: KORISNIK
    password: LOZINKA
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  jwt:
    secret: DUGACKA_NASUMICNA_TAJNA_MIN_32_KARAKTERA
    access-expiration-ms: 900000       # 15 min
    refresh-expiration-ms: 2592000000  # 30 dana
  security:
    rate-limit:
      capacity: 5
      refill-seconds: 60
