spring:
  application:
    name: habitflow-api
  profiles:
    active: dev

app:
  jwt:
    # U produkciji OBAVEZNO preko environment varijable! Ovo je samo podrazumevana dev vrednost.
    secret: ${JWT_SECRET:promeni-ovu-tajnu-na-nesto-dugacko-i-nasumicno-min-32-karaktera}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}        # 15 min
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000}  # 30 dana
  security:
    rate-limit:
      capacity: ${RATE_LIMIT_CAPACITY:5}          # max pokusaja
      refill-seconds: ${RATE_LIMIT_REFILL_SECONDS:60} # po vremenskom prozoru (sekunde)
  google:
    # Web OAuth Client ID iz Google Cloud Console (ne Android client ID) —
    # Android SDK mora traziti ID token sa ovim kao serverClientId.
    # Napomena: Client ID NIJE tajna (Google ga namerno pravi javnim, ugradjuje
    # se i u APK), za razliku od "client secret" koji se ovde uopste ne koristi
    # — zato je bezbedno da podrazumevana vrednost bude u repozitorijumu.
    client-id: ${GOOGLE_CLIENT_ID:485435476146-vr7aj1st6jlej7735m90kk6ofnj4m0r5.apps.googleusercontent.com}
  ai:
    anthropic:
      # LLM API kljuc ide ISKLJUCIVO preko environment varijable, nikad hardkodovan.
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}
      timeout-ms: ${ANTHROPIC_TIMEOUT_MS:9000}
